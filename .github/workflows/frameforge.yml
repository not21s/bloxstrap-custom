      - name: Publish single-file Windows app
        run: >
          dotnet publish ff/FrameForge/FrameForge.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o out

      - name: Show output
        shell: bash
        run: ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: FrameForge-app
          path: out/FrameForge.exe

      - name: Build FrameForge-Setup.exe installer (Inno Setup)
        continue-on-error: true
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          python -m pip install --quiet pillow
          cat > art.py <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont

          def font(size, bold=True):
              names = (["segoeuib.ttf", "seguisb.ttf", "arialbd.ttf", "DejaVuSans-Bold.ttf"] if bold
                       else ["segoeui.ttf", "arial.ttf", "DejaVuSans.ttf"])
              for n in names:
                  try:
                      return ImageFont.truetype(n, size)
                  except Exception:
                      pass
              return ImageFont.load_default()

          S = 4  # supersample for smooth edges
          TOP, BOT = (13, 15, 20), (24, 28, 40)
          ACCENT = (76, 141, 255)
          WHITE, MUTED = (240, 243, 250), (132, 140, 158)

          def gradient(w, h):
              img = Image.new("RGB", (w, h))
              d = ImageDraw.Draw(img)
              for y in range(h):
                  t = y / max(h - 1, 1)
                  d.line([(0, y), (w, y)], fill=tuple(int(TOP[i] + (BOT[i] - TOP[i]) * t) for i in range(3)))
              return img

          def mark(d, x, y, size):
              d.rounded_rectangle([x, y, x + size, y + size], radius=size // 4, fill=ACCENT)
              f = font(int(size * 0.62))
              d.text((x + size / 2, y + size / 2 + size * 0.02), "F", font=f, fill=WHITE, anchor="mm")

          def big():
              w, h = 164 * S, 314 * S
              img = gradient(w, h)
              d = ImageDraw.Draw(img)
              mark(d, 22 * S, 28 * S, 44 * S)
              d.text((22 * S, 92 * S), "FrameForge", font=font(22 * S), fill=WHITE, anchor="ls")
              d.text((22 * S, 112 * S), "Gaming tweaks", font=font(14 * S, False), fill=ACCENT, anchor="ls")
              d.line([(22 * S, 128 * S), (52 * S, 128 * S)], fill=ACCENT, width=2 * S)
              d.text((22 * S, 150 * S), "Reversible Windows", font=font(10 * S, False), fill=MUTED, anchor="ls")
              d.text((22 * S, 164 * S), "tweaks for gamers", font=font(10 * S, False), fill=MUTED, anchor="ls")
              d.text((22 * S, 292 * S), "version 1.0", font=font(9 * S, False), fill=MUTED, anchor="ls")
              return img.resize((164, 314), Image.LANCZOS)

          def small():
              w = h = 55 * S
              img = gradient(w, h)
              d = ImageDraw.Draw(img)
              mark(d, 7 * S, 7 * S, 41 * S)
              return img.resize((55, 55), Image.LANCZOS)

          big().save("wizard.bmp")
          small().save("small.bmp")
          print("art written", os.path.getsize("wizard.bmp"), os.path.getsize("small.bmp"))
          PY
          python art.py
          cat > setup.iss <<'ISS'
          [Setup]
          AppName=FrameForge
          AppVersion=1.0.0
          AppPublisher=FrameForge
          DefaultDirName={autopf}\FrameForge
          DefaultGroupName=FrameForge
          DisableProgramGroupPage=yes
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64compatible
          WizardStyle=classic
          SetupIconFile=ff\FrameForge\app.ico
          UninstallDisplayIcon={app}\FrameForge.exe
          WizardImageFile=wizard.bmp
          WizardSmallImageFile=small.bmp
          WizardImageStretch=no
          WizardImageBackColor=$140F0D
          BeveledLabel=FrameForge 1.0
          UninstallDisplayName=FrameForge
          Compression=lzma2
          SolidCompression=yes
          OutputDir=setup-out
          OutputBaseFilename=FrameForge-Setup

          [Messages]
          WelcomeLabel1=Welcome to FrameForge
          WelcomeLabel2=FrameForge applies reversible gaming tweaks to Windows: power, input, network, visuals and privacy. Every change saves your original setting first, so you can turn it off again.%n%nWindows will ask for administrator permission when you open the app.

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop shortcut"; Flags: checkedonce

          [Files]
          Source: "{#SourceExe}"; DestDir: "{app}"; DestName: "FrameForge.exe"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\FrameForge"; Filename: "{app}\FrameForge.exe"
          Name: "{autodesktop}\FrameForge"; Filename: "{app}\FrameForge.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\FrameForge.exe"; Description: "Open FrameForge"; Flags: nowait postinstall skipifsilent
          ISS
          SRC="$(pwd -W)\\out\\FrameForge.exe"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DSourceExe=$SRC" setup.iss
          ls -la setup-out

      - uses: actions/upload-artifact@v4
        with:
          name: FrameForge-Setup
          path: setup-out/FrameForge-Setup.exe

      - name: Publish direct-download Release (no zip)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="out/FrameForge.exe"
          if [ -f setup-out/FrameForge-Setup.exe ]; then FILES="$FILES setup-out/FrameForge-Setup.exe"; fi
          gh release create "frameforge-${{ github.run_number }}" $FILES --repo "${{ github.repository }}" --title "FrameForge build ${{ github.run_number }}" --notes "Direct downloads, no zip. FrameForge-Setup.exe is the installer; FrameForge.exe is the app on its own."
          URL="https://github.com/${{ github.repository }}/releases/tag/frameforge-${{ github.run_number }}"
          {
            echo "## Download FrameForge (no zip needed)"
            echo ""
            echo "$URL"
            echo ""
            echo "Click FrameForge-Setup.exe under Assets. Ignore the Artifacts section below, those are zip files."
          } >> "$GITHUB_STEP_SUMMARY"
