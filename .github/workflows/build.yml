      - name: Publish single-file Windows app
        run: >
          dotnet publish src/Bloxstrap/Bloxstrap.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o out

      - name: Show output
        shell: bash
        run: ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Bloxstrap-custom
          path: out/Bloxstrap.exe
