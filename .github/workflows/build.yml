name: Build custom Bloxstrap
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Get official v2.9.1 source and apply patch
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules --branch v2.9.1 https://github.com/bloxstraplabs/bloxstrap.git src
          cd src
          git apply --ignore-whitespace "$GITHUB_WORKSPACE/bloxstrap-custom.patch"

      - name: Publish single-file Windows app
        run: >
          dotnet publish src/Bloxstrap/Bloxstrap.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o out

      - name: Show output
        shell: bash
        run: ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Bloxstrap-custom
          path: out/Bloxstrap.exe
