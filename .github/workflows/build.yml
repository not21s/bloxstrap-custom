      - name: Check and test the Gaming Mode script
        continue-on-error: true
        shell: powershell
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE 'src\Bloxstrap\Resources\GamingMode.ps1'
          $errs = $null; $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errs)
          if ($errs.Count -gt 0) {
            $errs | ForEach-Object { Write-Host ("SYNTAX ERROR line " + $_.Extent.StartLineNumber + ": " + $_.Message) }
            exit 1
          }
          Write-Host 'GamingMode.ps1 syntax OK'
          $dir = Join-Path $env:RUNNER_TEMP 'gm'
          $res = Join-Path $env:RUNNER_TEMP 'gm-result.txt'
          & powershell -NoProfile -ExecutionPolicy Bypass -File $script -Action Apply -DataDir $dir -ResultFile $res -GameMode -DisableDvr -Mouse -Transparency -PowerPlan -Cpu -GpuScheduling -Mmcss
          Write-Host "Apply exit code: $LASTEXITCODE"
          Get-Content $res
          & powershell -NoProfile -ExecutionPolicy Bypass -File $script -Action Restore -DataDir $dir -ResultFile $res
          Write-Host "Restore exit code: $LASTEXITCODE"
          Get-Content $res

      - name: Publish single-file Windows app
        run: >
          dotnet publish src/Bloxstrap/Bloxstrap.csproj
          -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -o out

      - name: Show output
        shell: bash
        run: ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Bloxstrap-custom
          path: out/Bloxstrap.exe

      - name: Build Setup.exe installer (Inno Setup)
        continue-on-error: true
        shell: bash
        run: |
          choco install innosetup -y --no-progress
          python -m pip install --quiet pillow
          cat > art.py <<'PY'
          import os
          from PIL import Image, ImageDraw, ImageFont

          def font(size, bold=True):
              names = (["segoeuib.ttf", "seguisb.ttf", "arialbd.ttf", "DejaVuSans-Bold.ttf"] if bold
                       else ["segoeui.ttf", "arial.ttf", "DejaVuSans.ttf"])
              for n in names:
                  try:
                      return ImageFont.truetype(n, size)
                  except Exception:
                      pass
              return ImageFont.load_default()

          S = 4  # supersample for smooth edges
          TOP, BOT = (13, 15, 20), (24, 28, 40)
          ACCENT = (76, 141, 255)
          WHITE, MUTED = (240, 243, 250), (132, 140, 158)

          def gradient(w, h):
              img = Image.new("RGB", (w, h))
              d = ImageDraw.Draw(img)
              for y in range(h):
                  t = y / max(h - 1, 1)
                  d.line([(0, y), (w, y)], fill=tuple(int(TOP[i] + (BOT[i] - TOP[i]) * t) for i in range(3)))
              return img

          def mark(d, x, y, size):
              d.rounded_rectangle([x, y, x + size, y + size], radius=size // 4, fill=ACCENT)
              f = font(int(size * 0.62))
              d.text((x + size / 2, y + size / 2 + size * 0.02), "B", font=f, fill=WHITE, anchor="mm")

          def big():
              w, h = 164 * S, 314 * S
              img = gradient(w, h)
              d = ImageDraw.Draw(img)
              mark(d, 22 * S, 28 * S, 44 * S)
              d.text((22 * S, 92 * S), "Bloxstrap", font=font(22 * S), fill=WHITE, anchor="ls")
              d.text((22 * S, 112 * S), "Custom", font=font(14 * S, False), fill=ACCENT, anchor="ls")
              d.line([(22 * S, 128 * S), (52 * S, 128 * S)], fill=ACCENT, width=2 * S)
              d.text((22 * S, 150 * S), "Performance", font=font(10 * S, False), fill=MUTED, anchor="ls")
              d.text((22 * S, 164 * S), "presets built in", font=font(10 * S, False), fill=MUTED, anchor="ls")
              d.text((22 * S, 292 * S), "based on v2.9.1", font=font(9 * S, False), fill=MUTED, anchor="ls")
              return img.resize((164, 314), Image.LANCZOS)

          def small():
              w = h = 55 * S
              img = gradient(w, h)
              d = ImageDraw.Draw(img)
              mark(d, 7 * S, 7 * S, 41 * S)
              return img.resize((55, 55), Image.LANCZOS)

          big().save("wizard.bmp")
          small().save("small.bmp")
          print("art written", os.path.getsize("wizard.bmp"), os.path.getsize("small.bmp"))
          PY
          python art.py
          cat > setup.iss <<'ISS'
          [Setup]
          AppName=Bloxstrap Custom
          AppVersion=2.9.1-custom
          AppPublisher=Custom build
          CreateAppDir=no
          Uninstallable=no
          DisableProgramGroupPage=yes
          DisableReadyPage=no
          PrivilegesRequired=lowest
          WizardStyle=classic
          WizardImageFile=wizard.bmp
          WizardSmallImageFile=small.bmp
          WizardImageStretch=no
          WizardImageBackColor=$140F0D
          BeveledLabel=Bloxstrap Custom 2.9.1
          Compression=lzma2
          SolidCompression=yes
          OutputDir=setup-out
          OutputBaseFilename=Bloxstrap-Custom-Setup

          [Messages]
          SetupWindowTitle=Bloxstrap Custom Setup
          WelcomeLabel1=Welcome to Bloxstrap Custom
          WelcomeLabel2=This installs Bloxstrap Custom (based on Bloxstrap 2.9.1) for your Windows account. It includes a new Performance page with one-click FPS presets.%n%nNo administrator rights are needed. You can uninstall it any time from Windows Settings > Apps.
          FinishedHeadingLabel=Bloxstrap Custom is installed
          FinishedLabelNoIcons=Roblox links will now open through Bloxstrap Custom.

          [Tasks]
          Name: "desktopicon"; Description: "Create a &desktop shortcut"
          Name: "startmenuicon"; Description: "Create a &Start menu shortcut"

          [Files]
          Source: "{#SourceExe}"; DestDir: "{tmp}"; Flags: deleteafterinstall

          [Run]
          Filename: "{tmp}\Bloxstrap.exe"; Parameters: "-quiet"; StatusMsg: "Installing Bloxstrap Custom..."; Flags: waituntilterminated runhidden
          Filename: "{cmd}"; Parameters: "/c del ""{userdesktop}\Bloxstrap.lnk"""; Tasks: "!desktopicon"; Flags: runhidden
          Filename: "{cmd}"; Parameters: "/c del ""{userprograms}\Bloxstrap.lnk"""; Tasks: "!startmenuicon"; Flags: runhidden
          Filename: "{localappdata}\Bloxstrap\Bloxstrap.exe"; Description: "Open Bloxstrap settings"; Flags: nowait postinstall skipifsilent

          [Code]
          var
            ModePage: TInputOptionWizardPage;

          procedure InitializeWizard;
          var
            Note: TNewStaticText;
            Existing: String;
          begin
            ModePage := CreateInputOptionPage(wpWelcome,
              'Choose Installation Options',
              'Who should this application be installed for?',
              'Please select whether you wish to make this software available to all users or just yourself.',
              True, False);
            ModePage.Add('Anyone who uses this computer (all users) - not supported by Bloxstrap');
            ModePage.Add('Only for me (' + GetUserNameString + ')');
            ModePage.CheckListBox.ItemEnabled[0] := False;
            ModePage.Values[1] := True;

            Existing := ExpandConstant('{localappdata}\Bloxstrap');
            Note := TNewStaticText.Create(ModePage);
            Note.Parent := ModePage.Surface;
            Note.Left := 0;
            Note.Width := ModePage.SurfaceWidth;
            Note.Top := ModePage.SurfaceHeight - ScaleY(40);
            Note.AutoSize := False;
            Note.WordWrap := True;
            Note.Height := ScaleY(36);
            if FileExists(Existing + '\Bloxstrap.exe') then
              Note.Caption := 'There is already a per-user installation (' + Existing + '). Will reinstall/upgrade.'
            else
              Note.Caption := 'Bloxstrap Custom will be installed to ' + Existing + '.';
          end;
          ISS
          SRC="$(pwd -W)\\out\\Bloxstrap.exe"
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/DSourceExe=$SRC" setup.iss
          ls -la setup-out

      - uses: actions/upload-artifact@v4
        with:
          name: Bloxstrap-Custom-Setup
          path: setup-out/Bloxstrap-Custom-Setup.exe

      - name: Publish direct-download Release (no zip)
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES="out/Bloxstrap.exe"
          if [ -f setup-out/Bloxstrap-Custom-Setup.exe ]; then FILES="$FILES setup-out/Bloxstrap-Custom-Setup.exe"; fi
          gh release create "build-${{ github.run_number }}" $FILES --repo "${{ github.repository }}" --title "Bloxstrap Custom build ${{ github.run_number }}" --notes "Direct downloads, no zip. Bloxstrap-Custom-Setup.exe is the installer; Bloxstrap.exe is the app on its own."
          URL="https://github.com/${{ github.repository }}/releases/tag/build-${{ github.run_number }}"
          {
            echo "## Download (no zip needed)"
            echo ""
            echo "Open this page and click **Bloxstrap-Custom-Setup.exe** under Assets:"
            echo ""
            echo "$URL"
            echo ""
            echo "Please ignore the *Artifacts* section below. Those are zip files."
          } >> "$GITHUB_STEP_SUMMARY"
